<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق المحادثة والذكاء الاصطناعي</title>
    <style>
        :root {
            --bg-color: #0b141a;
            --chat-bg: #111b21;
            --header-bg: #202c33;
            --my-msg-bg: #005c4b;
            --other-msg-bg: #202c33;
            --text-color: #e9edef;
            --accent-color: #00a884;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
        }

        #login-screen, #chat-screen {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background: var(--chat-bg);
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        #login-screen {
            justify-content: center;
            align-items: center;
            padding: 25px;
            text-align: center;
        }

        #login-screen h2 { margin-bottom: 10px; color: var(--accent-color); font-size: 24px; }
        #login-screen p { margin-bottom: 25px; opacity: 0.8; font-size: 14px; }

        #login-screen input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: 1px solid #2a3942;
            background: #202c33;
            color: white;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: #111b21;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }

        .btn-global {
            background: #0088cc;
            color: white;
        }

        .divider {
            margin: 15px 0;
            opacity: 0.5;
            font-size: 12px;
        }

        header {
            background-color: var(--header-bg);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222d34;
        }

        header .info h3 { font-size: 16px; color: var(--accent-color); }
        header .info p { font-size: 12px; opacity: 0.7; }

        header .header-btns button {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        #messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
        }

        .message.my-msg { background-color: var(--my-msg-bg); align-self: flex-start; border-top-right-radius: 0; }
        .message.other-msg { background-color: var(--other-msg-bg); align-self: flex-end; border-top-left-radius: 0; }
        .message.ai-msg { background-color: #1e3a5f; color: #e0f2fe; align-self: center; width: 92%; border-radius: 12px; }

        .message .sender { font-size: 11px; font-weight: bold; color: var(--accent-color); margin-bottom: 4px; display: block; }
        .message.ai-msg .sender { color: #38bdf8; }

        .message .time { font-size: 10px; opacity: 0.6; display: block; text-align: left; margin-top: 5px; }

        .message img, .message audio {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 6px;
        }

        #emoji-bar {
            display: flex;
            gap: 8px;
            padding: 6px 10px;
            background: #182229;
            overflow-x: auto;
        }

        #emoji-bar span {
            font-size: 20px;
            cursor: pointer;
            padding: 2px 5px;
            border-radius: 5px;
        }

        #input-area {
            display: flex;
            padding: 10px;
            background-color: var(--header-bg);
            gap: 8px;
            align-items: center;
        }

        #input-area input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border: none;
            background: #2a3942;
            color: white;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }

        .btn-action {
            background-color: transparent;
            color: #8696a0;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
        }

        .btn-send {
            background-color: var(--accent-color);
            color: #111b21;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-mic.recording {
            color: #f44336;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        #file-input { display: none; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>🔥 الشات الأسطوري</h2>
        <p>دردشة عالمية وتوليد صور فورية بالذكاء الاصطناعي</p>
        
        <input type="text" id="username-input" placeholder="ادخل اسمك هنا..." />
        
        <button class="btn-main btn-global" onclick="joinGlobalRoom()">🌍 دخول الدردشة العالمية</button>
        
        <div class="divider">─── أو انضم لغرفة خاصة ───</div>
        
        <input type="text" id="room-input" placeholder="اسم الغرفة الخاصة..." />
        <button class="btn-main" onclick="joinPrivateRoom()">🔒 دخول الغرفة الخاصة</button>
    </div>

    <div id="chat-screen" style="display: none;">
        <header>
            <div class="info">
                <h3 id="room-display">الدردشة: </h3>
                <p id="user-display">أنت: </p>
            </div>
            <div class="header-btns">
                <button onclick="leaveRoom()">خروج</button>
            </div>
        </header>

        <div id="messages"></div>

        <div id="emoji-bar">
            <span onclick="sendEmoji('🔥')">🔥</span>
            <span onclick="sendEmoji('😂')">😂</span>
            <span onclick="sendEmoji('❤️')">❤️</span>
            <span onclick="sendEmoji('👍')">👍</span>
            <span onclick="sendEmoji('🎮')">🎮</span>
            <span onclick="sendEmoji('✨')">✨</span>
        </div>

        <div id="input-area">
            <button class="btn-action" onclick="document.getElementById('file-input').click()">📁</button>
            <input type="file" id="file-input" accept="image/*" onchange="uploadFromGallery(this)" />
            
            <button id="mic-btn" class="btn-action btn-mic" onclick="toggleRecording()">🎤</button>

            <input type="text" id="msg-input" placeholder="اكتب رسالتك أو 'صورة كلب'..." onkeypress="handleKeyPress(event)" />
            <button class="btn-send" onclick="sendTextMessage()">➤</button>
        </div>
    </div>

    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
    <script>
        let pubnub;
        let username = "";
        let currentRoom = "";
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        function initPubNub() {
            pubnub = new PubNub({
                publishKey: "demo",
                subscribeKey: "demo",
                userId: username + "_" + Math.floor(Math.random() * 1000)
            });

            pubnub.addListener({
                message: function(m) {
                    displayMessage(m.message);
                }
            });
        }

        function joinGlobalRoom() {
            const uInput = document.getElementById('username-input').value.trim();
            if (!uInput) { alert("يرجى كتابة الاسم أولاً!"); return; }
            username = uInput;
            currentRoom = "global_chat_room_2026";
            startChat("الدردشة العالمية 🌍");
        }

        function joinPrivateRoom() {
            const uInput = document.getElementById('username-input').value.trim();
            const rInput = document.getElementById('room-input').value.trim();
            if (!uInput || !rInput) { alert("يرجى كتابة الاسم واسم الغرفة!"); return; }
            username = uInput;
            currentRoom = "room_" + rInput.toLowerCase();
            startChat("غرفة: " + rInput);
        }

        function startChat(roomTitle) {
            initPubNub();
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            document.getElementById('room-display').innerText = roomTitle;
            document.getElementById('user-display').innerText = "المستخدم: " + username;

            pubnub.subscribe({ channels: [currentRoom] });
        }

        async function sendTextMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text) return;

            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            pubnub.publish({
                channel: currentRoom,
                message: { sender: username, type: 'text', content: text, time: timeStr }
            });

            input.value = "";
            const rawText = text.toLowerCase().trim();

            // 1. توليد الصور بالذكاء الاصطناعي
            if (rawText.includes("صورة") || rawText.includes("صوره") || rawText.includes("ارسم")) {
                let prompt = text.replace(/^(ذكاء|ai)\s+/i, "");
                prompt = prompt.replace(/(صورة|صوره|ارسم|لـ|عن)/gi, "").trim();

                pubnub.publish({
                    channel: currentRoom,
                    message: { sender: "🤖 الذكاء الاصطناعي", type: 'text', content: "🎨 جاري رسم الصورة...", time: timeStr }
                });

                // قاموس سريع للكلمات الشهيرة لضمان الدقة العالية
                let translatedPrompt = prompt;
                if (prompt.includes("جون سينا")) translatedPrompt = "John Cena";
                else if (prompt.includes("سيارة")) translatedPrompt = "sports car";
                else if (prompt.includes("كلب")) translatedPrompt = "cute dog";
                else if (prompt.includes("قطة") || prompt.includes("قط")) translatedPrompt = "cute cat";

                const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(translatedPrompt)}?width=512&height=512&seed=${Math.floor(Math.random()*9999)}&nologo=true`;

                pubnub.publish({
                    channel: currentRoom,
                    message: { sender: "🤖 الذكاء الاصطناعي", type: 'image', content: imageUrl, time: timeStr }
                });
                return;
            }

            // 2. المحادثة النصية الذكية
            if (rawText.startsWith("ذكاء") || rawText.startsWith("ai")) {
                const cleanQuery = text.replace(/^(ذكاء|ai)\s+/i, "").trim();

                pubnub.publish({
                    channel: currentRoom,
                    message: { sender: "🤖 الذكاء الاصطناعي", type: 'text', content: "جاري التفكير...", time: timeStr }
                });

                try {
                    const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(cleanQuery)}`);
                    const aiAnswer = await res.text();

                    pubnub.publish({
                        channel: currentRoom,
                        message: { sender: "🤖 الذكاء الاصطناعي", type: 'ai', content: aiAnswer || "عذراً، لم أستطع الفهم.", time: timeStr }
                    });
                } catch (err) {
                    pubnub.publish({
                        channel: currentRoom,
                        message: { sender: "🤖 الذكاء الاصطناعي", type: 'ai', content: "خطأ في الاتصال بالذكاء الاصطناعي.", time: timeStr }
                    });
                }
            }
        }

        function sendEmoji(emoji) {
            document.getElementById('msg-input').value += emoji;
        }

        function uploadFromGallery(input) {
            const file = input.files[0];
            if (!file) return;

            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const reader = new FileReader();

            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxWidth = 400;
                    const scale = maxWidth / img.width;
                    
                    if (scale < 1) {
                        canvas.width = maxWidth;
                        canvas.height = img.height * scale;
                    } else {
                        canvas.width = img.width;
                        canvas.height = img.height;
                    }

                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.6);

                    pubnub.publish({
                        channel: currentRoom,
                        message: { sender: username, type: 'image', content: compressedBase64, time: timeStr }
                    });
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
            input.value = "";
        }

        async function toggleRecording() {
            const micBtn = document.getElementById('mic-btn');
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                            pubnub.publish({
                                channel: currentRoom,
                                message: { sender: username, type: 'audio', content: reader.result, time: timeStr }
                            });
                        };
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    micBtn.classList.add('recording');
                } catch (err) {
                    alert("يرجى سماح الميكروفون لاستخدامه.");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                micBtn.classList.remove('recording');
            }
        }

        function displayMessage(msg) {
            const messagesDiv = document.getElementById('messages');
            const msgEl = document.createElement('div');
            
            if (msg.type === 'ai') {
                msgEl.className = 'message ai-msg';
            } else {
                const isMe = (msg.sender === username);
                msgEl.className = 'message ' + (isMe ? 'my-msg' : 'other-msg');
            }

            let contentHTML = `<span class="sender">${msg.sender}</span>`;
            
            if (msg.type === 'text' || msg.type === 'ai') {
                contentHTML += msg.content;
            } else if (msg.type === 'image') {
                contentHTML += `<img src="${msg.content}" alt="صورة" />`;
            } else if (msg.type === 'audio') {
                contentHTML += `<audio src="${msg.content}" controls></audio>`;
            }

            contentHTML += `<span class="time">${msg.time || ''}</span>`;

            msgEl.innerHTML = contentHTML;
            messagesDiv.appendChild(msgEl);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendTextMessage();
        }

        function leaveRoom() {
            if (pubnub) pubnub.unsubscribeAll();
            document.getElementById('messages').innerHTML = "";
            document.getElementById('chat-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
        }
    </script>
</body>
</html>
