<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق المحادثة والذكاء الاصطناعي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #e5ddd5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #login-screen, #chat-screen {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background: #efeae2;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        #login-screen {
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #075e54;
            color: white;
            text-align: center;
        }
        #login-screen h2 { margin-bottom: 20px; }
        #login-screen input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }
        #login-screen button {
            width: 100%;
            padding: 12px;
            background: #25d366;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        header {
            background-color: #075e54;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header .info h3 { font-size: 16px; }
        header .info p { font-size: 12px; opacity: 0.8; }
        header button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
        }
        #messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .message.my-msg { background-color: #dcf8c6; align-self: flex-start; }
        .message.other-msg { background-color: #ffffff; align-self: flex-end; }
        .message.ai-msg { background-color: #e3f2fd; align-self: center; border: 1px solid #90caf9; width: 90%; }
        .message .sender { font-size: 11px; font-weight: bold; color: #075e54; margin-bottom: 4px; display: block; }
        .message.ai-msg .sender { color: #1565c0; }
        .message img, .message video {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 5px;
        }
        #input-area {
            display: flex;
            padding: 10px;
            background-color: #f0f0f0;
            gap: 6px;
            align-items: center;
        }
        #input-area input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border: none;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }
        .btn-action {
            background-color: #075e54;
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }
        #file-input { display: none; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen">
        <h2>شات الذكاء الاصطناعي والميديا</h2>
        <input type="text" id="username-input" placeholder="اسمك..." />
        <input type="text" id="room-input" placeholder="اسم الغرفة (مثال: room99)" />
        <button onclick="joinRoom()">دخول المحادثة</button>
    </div>

    <!-- شاشة المحادثة -->
    <div id="chat-screen" style="display: none;">
        <header>
            <div class="info">
                <h3 id="room-display">الغرفة: </h3>
                <p id="user-display">أنت: </p>
            </div>
            <button onclick="leaveRoom()">تغيير الغرفة</button>
        </header>
        <div id="messages"></div>
        <div id="input-area">
            <button class="btn-action" onclick="document.getElementById('file-input').click()">📁 المعرض</button>
            <input type="file" id="file-input" accept="image/*" onchange="uploadFromGallery(this)" />
            
            <input type="text" id="msg-input" placeholder="اكتب رسالة (أو 'ذكاء' لـ AI)..." onkeypress="handleKeyPress(event)" />
            <button class="btn-action" onclick="sendTextMessage()">➤</button>
        </div>
    </div>

    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
    <script>
        let pubnub;
        let username = "";
        let currentRoom = "";

        function joinRoom() {
            const uInput = document.getElementById('username-input').value.trim();
            const rInput = document.getElementById('room-input').value.trim();

            if (!uInput || !rInput) {
                alert("يرجى كتابة الاسم واسم الغرفة أولاً!");
                return;
            }

            username = uInput;
            currentRoom = "room_" + rInput.toLowerCase();

            pubnub = new PubNub({
                publishKey: "demo",
                subscribeKey: "demo",
                userId: username + "_" + Math.floor(Math.random() * 1000)
            });

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            document.getElementById('room-display').innerText = "الغرفة: " + rInput;
            document.getElementById('user-display').innerText = "الاسم: " + username;

            pubnub.addListener({
                message: function(m) {
                    displayMessage(m.message);
                }
            });

            pubnub.subscribe({ channels: [currentRoom] });
        }

        async function sendTextMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text) return;

            pubnub.publish({
                channel: currentRoom,
                message: { sender: username, type: 'text', content: text }
            });

            input.value = "";

            const lowerText = text.toLowerCase();
            if (lowerText.startsWith("ذكاء ") || lowerText.startsWith("ai ")) {
                const promptQuery = text.replace(/^(ذكاء|ai)\s+/i, "");
                
                pubnub.publish({
                    channel: currentRoom,
                    message: { sender: "🤖 الذكاء الاصطناعي", type: 'text', content: "جاري التفكير والأجابة..." }
                });

                try {
                    // استخدام محرك الذكاء الاصطناعي الذكي
                    const res = await fetch(`https://api.pollinations.ai/prompt/${encodeURIComponent(promptQuery)}?model=openai`);
                    const aiAnswer = await res.text();

                    pubnub.publish({
                        channel: currentRoom,
                        message: { sender: "🤖 الذكاء الاصطناعي", type: 'ai', content: aiAnswer || "عذراً لم أستطع الإجابة." }
                    });
                } catch (err) {
                    pubnub.publish({
                        channel: currentRoom,
                        message: { sender: "🤖 الذكاء الاصطناعي", type: 'ai', content: "حدث خطأ أثناء التواصل مع الذكاء الاصطناعي." }
                    });
                }
            }
        }

        async function uploadFromGallery(input) {
            const file = input.files[0];
            if (!file) return;

            pubnub.publish({
                channel: currentRoom,
                message: { sender: username, type: 'text', content: "⏳ جاري رفع الصورة من المعرض..." }
            });

            const apiKey = 'd822557e93bd0db4ca7dc621184fb24e';
            const formData = new FormData();
            formData.append('image', file);

            try {
                const res = await fetch(`https://api.imgbb.com/1/upload?key=${apiKey}`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (data && data.success) {
                    pubnub.publish({
                        channel: currentRoom,
                        message: { 
                            sender: username, 
                            type: 'image', 
                            content: data.data.url 
                        }
                    });
                } else {
                    alert("فشل الرفع، يرجى اختيار صورة بحجم أصغر.");
                }
            } catch (err) {
                alert("حدث خطأ أثناء الاتصال بسيرفر الرفع.");
            }
            
            input.value = "";
        }

        function displayMessage(msg) {
            const messagesDiv = document.getElementById('messages');
            const msgEl = document.createElement('div');
            
            if (msg.type === 'ai') {
                msgEl.className = 'message ai-msg';
            } else {
                const isMe = (msg.sender === username);
                msgEl.className = 'message ' + (isMe ? 'my-msg' : 'other-msg');
            }

            let contentHTML = `<span class="sender">${msg.sender}</span>`;
            
            if (msg.type === 'text' || msg.type === 'ai') {
                contentHTML += msg.content;
            } else if (msg.type === 'image') {
                contentHTML += `<img src="${msg.content}" alt="صورة" />`;
            }

            msgEl.innerHTML = contentHTML;
            messagesDiv.appendChild(msgEl);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendTextMessage();
        }

        function leaveRoom() {
            if (pubnub) pubnub.unsubscribeAll();
            document.getElementById('messages').innerHTML = "";
            document.getElementById('chat-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
        }
    </script>
</body>
</html>
